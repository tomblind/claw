<!doctype html>
<html>
<head>
	<meta charset="utf-8">
	<title>Claw</title>
	<style>
		* { margin: 0; padding: 0; box-sizing: border-box; }
		html, body { height: 100%; font-family: 'Inter', -apple-system, 'Segoe UI', Roboto, sans-serif; }
		body { display: flex; flex-direction: column; background: #16161c; }
		#frame { flex: 1; border: 0; width: 100%; background: #fbfbfb; }
		#overlay {
			position: fixed; inset: 0; display: none;
			align-items: center; justify-content: center; flex-direction: column; gap: 14px;
			background: #fbfbfb; color: #444; font-size: 15px; text-align: center;
		}
		#overlay.show { display: flex; }
		#overlay button { font: inherit; padding: 8px 18px; cursor: pointer; }
	</style>
</head>
<body>
	<!-- the served shell page (tab bar + modals + canvas) — the same UI a
	     browser gets, plus native dialogs bridged from this window.
	     allow: the canvas is cross-origin (core port vs app origin); without
	     explicit delegation the browser denies clipboard access inside it -->
	<iframe id="frame" src="about:blank" allow="clipboard-read; clipboard-write"></iframe>
	<!-- hidden executor: the real tldraw editor the core drives for agent
	     commands (project/render/apply). Lives here so the app IS the system:
	     window open = agent commands work, window closed = everything stops. -->
	<iframe id="executor" src="about:blank" style="position:fixed; width:1280px; height:800px; left:-10000px; top:0; border:0" aria-hidden="true" tabindex="-1"></iframe>
	<div id="overlay">
		<div id="overlay-msg">Starting the canvas daemon…</div>
		<button id="retry" style="display:none">Retry</button>
	</div>
	<script src="js/neutralino.js"></script>
	<script src="js/main.js"></script>
</body>
</html>
